name: Autonomous Tractor Loader Counterweight & Tire Ballast Engine

on:
  schedule:
    - cron: '16 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_tractor:
        description: 'Optional Tractor or Tire Model (e.g. Kubota L2501 LA525 or John Deere 1025R)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-ballast-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Tractor Ballast Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_TRACTOR: ${{ github.event.inputs.custom_tractor || '' }}
        run: |
          python engine/ballast_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_tractors.json
          if git diff --staged --quiet; then
            echo "No new tractor ballast calculator pages to commit."
          else
            git commit -m "chore(tractor): auto-publish new tractor 3-point ballast & tire liquid calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
